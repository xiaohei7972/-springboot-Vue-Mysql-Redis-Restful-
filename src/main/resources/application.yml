server:
  port: 8080
spring:
  application:
    name: student-management
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:student_management}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
app:
  jwt:
    secret: ${JWT_SECRET:student-management-secret-key-change-in-production-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:7200000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
logging:
  level:
    com.student: info
